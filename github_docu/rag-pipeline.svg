<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">productChatbot pipeline: ingest, retrieve, and answer with evidence</title>
  <desc id="desc">A dark pipeline diagram showing document ingestion into verified facts and PostgreSQL, LangGraph chat routing, active lexical retrieval, evidence selection through the OpenAI API on a VPS, citation checks, and an optional future embeddings path with pgvector.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111b2d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#44d7b6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#68819d"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#e6edf6}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2px;fill:#63d8c0}.title{font-size:34px;font-weight:750}.sub{font-size:17px;fill:#9fb0c6}.card{fill:#162338;stroke:#2a3b53;stroke-width:1.3}.cardTitle{font-size:17px;font-weight:700}.body{font-size:14px;fill:#b9c7d8}.small{font-size:12px;fill:#9fb0c6}.tag{font-size:11px;font-weight:700;letter-spacing:1px}.active{fill:#3cdbb0}.future{fill:#f2bb69}.line{fill:none;stroke:#68819d;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#d09a4e;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1080" rx="24" fill="url(#bg)"/>
  <text x="64" y="62" class="eyebrow">PRODUCTCHATBOT · ARCHITECTURE</text>
  <text x="64" y="108" class="title">From source document to verifiable answer</text>
  <text x="64" y="140" class="sub">LangGraph coordinates two evidence paths. Answers trace back to their source.</text>

  <text x="64" y="190" class="eyebrow">1 · SOURCE INGESTION AND PREPARATION</text>
  <g filter="url(#shadow)">
    <rect x="64" y="212" width="230" height="116" rx="16" class="card"/>
    <rect x="328" y="212" width="258" height="116" rx="16" class="card"/>
    <rect x="620" y="196" width="322" height="148" rx="16" class="card"/>
    <rect x="976" y="212" width="194" height="116" rx="16" class="card"/>
    <rect x="1204" y="212" width="172" height="116" rx="16" class="card"/>
  </g>
  <path d="M294 270h26M586 270h26M942 270h26M1170 270h26" class="line"/>
  <text x="84" y="244" class="tag active">SOURCES</text><text x="84" y="274" class="cardTitle">PDF · Markdown · text</text><text x="84" y="300" class="body">Product sheets and manuals</text>
  <text x="348" y="244" class="tag active">EXTRACTION</text><text x="348" y="274" class="cardTitle">Text + structure</text><text x="348" y="300" class="body">Page · section · tables</text>
  <text x="640" y="228" class="tag active">TWO REPRESENTATIONS</text><text x="640" y="263" class="cardTitle">Verified facts</text><text x="640" y="286" class="body">Field · value · unit · page · source</text><path d="M640 304h282" stroke="#2a3b53"/><text x="640" y="329" class="body">Prose chunks with metadata</text>
  <text x="996" y="244" class="tag active">PERSISTENCE</text><text x="996" y="274" class="cardTitle">PostgreSQL</text><text x="996" y="300" class="body">Data + lexical index</text>
  <text x="1224" y="244" class="tag active">VERSIONING</text><text x="1224" y="274" class="cardTitle">Citable sources</text><text x="1224" y="300" class="body">Document · page</text>

  <text x="64" y="398" class="eyebrow">2 · LANGGRAPH RESPONSE FLOW</text>
  <g filter="url(#shadow)">
    <rect x="64" y="425" width="204" height="110" rx="16" class="card"/>
    <rect x="300" y="425" width="204" height="110" rx="16" class="card"/>
    <rect x="536" y="406" width="360" height="148" rx="16" fill="#172b3d" stroke="#44d7b6" stroke-width="1.8"/>
    <rect x="928" y="425" width="204" height="110" rx="16" class="card"/>
    <rect x="1164" y="425" width="212" height="110" rx="16" fill="#17352f" stroke="#44d7b6" stroke-width="1.8"/>
  </g>
  <path d="M268 480h28M504 480h28M896 480h28M1132 480h28" class="line"/>
  <text x="84" y="458" class="tag active">INPUT</text><text x="84" y="489" class="cardTitle">Question + thread</text><text x="84" y="514" class="body">Natural language</text>
  <text x="320" y="458" class="tag active">CONTROL</text><text x="320" y="489" class="cardTitle">Guardrails</text><text x="320" y="514" class="body">Intent · boundaries</text>
  <text x="556" y="438" class="tag active">ROUTE BY DATA TYPE</text><text x="556" y="476" class="cardTitle">Specification / structured price</text><text x="556" y="503" class="body">Look up by field and product</text><text x="556" y="527" class="body">Verified value + citation</text>
  <text x="948" y="458" class="tag active">OPEN-ENDED QUERY</text><text x="948" y="489" class="cardTitle">Prose RAG</text><text x="948" y="514" class="body">Retrieve passages</text>
  <text x="1184" y="458" class="tag active">OUTPUT</text><text x="1184" y="489" class="cardTitle">Cited answer</text><text x="1184" y="514" class="body">Source evidence</text>

  <path d="M1030 535v42H714v-20" class="line"/>
  <g filter="url(#shadow)">
    <rect x="536" y="596" width="360" height="120" rx="16" class="card"/>
    <rect x="928" y="596" width="204" height="120" rx="16" class="card"/>
    <rect x="1164" y="596" width="212" height="120" rx="16" class="card"/>
  </g>
  <path d="M896 656h28M1132 656h28" class="line"/>
  <text x="556" y="628" class="tag active">ACTIVE RETRIEVAL</text><text x="556" y="659" class="cardTitle">PostgreSQL Full Text Search</text><text x="556" y="686" class="body">Lexical query + term expansion</text>
  <text x="948" y="628" class="tag active">VPS SELECTOR</text><text x="948" y="659" class="cardTitle">OpenAI API</text><text x="948" y="686" class="body">Selects passage IDs</text>
  <text x="1184" y="628" class="tag active">VALIDATION</text><text x="1184" y="659" class="cardTitle">Server verifies</text><text x="1184" y="686" class="body">Cites document + page</text>
  <path d="M1268 596v-41" class="line"/>

  <rect x="64" y="760" width="1312" height="252" rx="20" fill="#211e1b" stroke="#77582f" stroke-width="1.5"/>
  <text x="92" y="800" class="eyebrow" style="fill:#f2bb69">OPTIONAL EXTENSION · EMBEDDINGS (NOT ACTIVE IN THE CURRENT FLOW)</text>
  <text x="92" y="840" class="cardTitle">Consider if evaluation shows missed semantic matches</text>
  <rect x="92" y="866" width="274" height="102" rx="14" fill="#30281d" stroke="#77582f"/>
  <rect x="406" y="866" width="274" height="102" rx="14" fill="#30281d" stroke="#77582f"/>
  <rect x="720" y="866" width="274" height="102" rx="14" fill="#30281d" stroke="#77582f"/>
  <rect x="1034" y="866" width="314" height="102" rx="14" fill="#30281d" stroke="#77582f"/>
  <path d="M366 917h34M680 917h34M994 917h34" class="dash"/>
  <text x="112" y="897" class="tag future">1 · EVALUATE AND CHOOSE</text><text x="112" y="924" class="body">A multilingual model</text><text x="112" y="948" class="small">Quality · privacy · license · cost</text>
  <text x="426" y="897" class="tag future">2 · EMBED AT INGESTION</text><text x="426" y="924" class="body">Vectors per passage</text><text x="426" y="948" class="small">Track model version and dimensions</text>
  <text x="740" y="897" class="tag future">3 · STORE</text><text x="740" y="924" class="body">pgvector in PostgreSQL</text><text x="740" y="948" class="small">Alongside text and source metadata</text>
  <text x="1054" y="897" class="tag future">4 · MEASURE HYBRID SEARCH</text><text x="1054" y="924" class="body">Semantic + lexical retrieval</text><text x="1054" y="948" class="small">Enable only if recall and citations improve</text>
  <text x="92" y="992" class="small">The local llama-server option is for development. OpenAI receives the question and retrieved candidate passages.</text>
</svg>
